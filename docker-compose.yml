services:
  # Ollama LLM Backend
  ollama:
    image: ollama/ollama:latest
    container_name: kids-channel-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "sh", "-c", "test -f /root/.ollama/id_ed25519 && echo 'ok'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Python Worker - Story Generation, TTS, Video Processing
  worker:
    build: ./worker
    container_name: kids-channel-worker
    ports:
      - "8000:8000"
    environment:
      - OLLAMA_URL=http://ollama:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.2:3b}
      - WORKER_PORT=8000
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - VIDEO_WIDTH=${VIDEO_WIDTH:-1280}
      - VIDEO_HEIGHT=${VIDEO_HEIGHT:-720}
      - VIDEO_FPS=${VIDEO_FPS:-30}
      - GENERATE_ONLY=${GENERATE_ONLY:-true}
    volumes:
      - ./worker:/app
      - ./data:/data
      - ./prompts:/app/prompts
      - ./credentials:/app/credentials
    restart: unless-stopped
    depends_on:
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  ollama_data:
