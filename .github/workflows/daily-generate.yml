name: Generate Video Daily

on:
  schedule:
    # Run every day at 9 AM UTC
    - cron: '0 9 * * *'
  
  # Allow manual trigger
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    
    services:
      ollama:
        image: ollama/ollama:latest
        ports:
          - 11434:11434
        options: >-
          --health-cmd "curl -f http://localhost:11434/api/tags || exit 1"
          --health-interval 30s
          --health-timeout 10s
          --health-retries 5
        volumes:
          - ollama-data:/root/.ollama
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y espeak-ng ffmpeg curl
    
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r worker/requirements.txt
    
    - name: Wait for Ollama
      run: |
        echo "Waiting for Ollama service..."
        for i in {1..60}; do
          if curl -f http://localhost:11434/api/tags; then
            echo "✅ Ollama is ready"
            break
          fi
          echo "Waiting... ($i/60)"
          sleep 5
        done
    
    - name: Pull Ollama model
      run: |
        echo "Pulling llama3.2:3b model..."
        curl -X POST http://localhost:11434/api/pull -d '{"name":"llama3.2:3b"}' -v
        sleep 30
    
    - name: Generate video
      run: |
        cd worker
        export OLLAMA_URL=http://localhost:11434
        export OLLAMA_MODEL=llama3.2:3b
        python -c "
import asyncio
from pipeline import generate_story
import json
import datetime

try:
    result = asyncio.run(generate_story())
    
    # Log result
    log = {
        'timestamp': datetime.datetime.now().isoformat(),
        'status': 'success',
        'job_id': result.get('job_id'),
        'title': result.get('title'),
        'video_file': result.get('video_file'),
        'duration': result.get('total_duration')
    }
    
    print('✅ Video generated successfully!')
    print(json.dumps(log, indent=2))
    
except Exception as e:
    print(f'❌ Generation failed: {e}')
    import traceback
    traceback.print_exc()
    exit(1)
        "
    
    - name: Upload video artifact
      if: success()
      uses: actions/upload-artifact@v3
      with:
        name: generated-video
        path: data/videos/
        retention-days: 30
    
    - name: Upload story artifact
      if: success()
      uses: actions/upload-artifact@v3
      with:
        name: generated-story
        path: data/stories/
        retention-days: 30
    
    - name: Post success message
      if: success()
      run: echo "✅ Daily video generation completed successfully!"
    
    - name: Post failure message
      if: failure()
      run: echo "❌ Daily video generation failed. Check logs."

volumes:
  ollama-data:
