name: Build and Test Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    services:
      ollama:
        image: ollama/ollama:latest
        ports:
          - 11434:11434
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y espeak-ng ffmpeg curl
    
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r worker/requirements.txt
    
    - name: Wait for Ollama to be ready
      run: |
        echo "Waiting for Ollama service to be fully ready..."
        for i in {1..180}; do
          if curl -s http://localhost:11434/api/tags > /dev/null 2>&1; then
            echo "✅ Ollama is ready"
            break
          fi
          echo "Attempt $i/180: Waiting for Ollama..."
          sleep 1
        done
    
    - name: Pull Ollama model
      run: |
        echo "Pulling llama3.2:3b model..."
        curl -X POST http://localhost:11434/api/pull -d '{"name":"llama3.2:3b"}' || true
        sleep 10
      continue-on-error: true
    
    - name: Lint Python code
      run: |
        pip install flake8
        flake8 worker/*.py --count --select=E9,F63,F7,F82 --show-source --statistics
      continue-on-error: true
    
    - name: Test imports
      run: |
        cd worker
        python -c "from pipeline import generate_story; print('✅ Pipeline imports OK')"
        python -c "from story import generate_story_with_llm; print('✅ Story module OK')"
        python -c "from tts import generate_narration_from_story; print('✅ TTS module OK')"
        python -c "from scenes import generate_scenes; print('✅ Scenes module OK')"
        python -c "from blender_animation import create_animated_video; print('✅ Animation compositor OK')"
        python -m compileall -q worker
        python -c "from video import create_video; print('✅ Video module OK')"
        python -c "from youtube import upload_to_youtube; print('✅ YouTube module OK')"
    
    - name: Verify Docker files
      run: |
        ls -la worker/Dockerfile
        ls -la docker-compose.yml
        ls -la .env.example
    
    - name: Check documentation
      run: |
        test -f README.md && echo "✅ README.md exists"
        test -f QUICK_START.md && echo "✅ QUICK_START.md exists"
        test -f FINAL_README.md && echo "✅ FINAL_README.md exists"
    
    - name: Render sample animation
      if: success()
      run: |
        cd worker
        python - <<'PY'
        from pathlib import Path
        import math
        import struct
        import wave
        import asyncio
        from scenes import generate_scenes
        from blender_animation import create_animated_video

        data = Path("../data")
        audio_dir = data / "audio"
        audio_dir.mkdir(parents=True, exist_ok=True)

        sample_wav = audio_dir / "ci_sample.wav"
        sample_srt = audio_dir / "ci_sample.srt"
        sample_rate = 22050
        duration = 6.0
        frames = int(sample_rate * duration)

        # Deterministic synthetic narration track: a quiet tone keeps CI self-contained
        # while exercising the real FFmpeg audio/video muxing path.
        with wave.open(str(sample_wav), "wb") as wav:
            wav.setnchannels(1)
            wav.setsampwidth(2)
            wav.setframerate(sample_rate)
            for n in range(frames):
                value = int(1800 * math.sin(2 * math.pi * 440 * n / sample_rate))
                wav.writeframes(struct.pack("<h", value))

        sample_srt.write_text(
            "1\n00:00:00,000 --> 00:00:03,000\n"
            "Welcome to our little adventure!\n\n"
            "2\n00:00:03,000 --> 00:00:06,000\n"
            "Let's explore together!\n",
            encoding="utf-8",
        )

        story = {
            "title": "CI Sample Adventure",
            "description": "A short deterministic render used to verify the animation pipeline.",
            "duration_seconds": 6,
            "scenes": [
                {
                    "number": 1,
                    "visual_description": "A cheerful rabbit walks along a sunny forest path with flowers.",
                    "action": "walking",
                    "emotion": "happy",
                    "camera": "wide",
                    "motion": "slow push in",
                },
                {
                    "number": 2,
                    "visual_description": "A cheerful rabbit waves beside a tree in a bright garden.",
                    "action": "waving",
                    "emotion": "excited",
                    "camera": "medium",
                    "motion": "gentle pan",
                },
            ],
        }
        audio_data = {
            "narration_file": str(sample_wav),
            "subtitles_file": str(sample_srt),
            "total_duration": duration,
            "scene_narrations": [
                {"scene_num": 1, "duration": 3.0},
                {"scene_num": 2, "duration": 3.0},
            ],
        }

        scene_data = asyncio.run(generate_scenes(story, "ci-sample"))
        result = asyncio.run(
            create_animated_video(story, audio_data, scene_data, "ci-sample")
        )
        output = Path(result["video_file"])
        assert output.exists() and output.stat().st_size > 100_000, result
        print(f"Generated sample video: {output} ({output.stat().st_size} bytes)")
        PY

    - name: Upload generated animation
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: sample-animation-video
        path: |
          worker/data/videos/ci-sample.mp4
          worker/data/scenes/ci-sample_scene_*.png
        if-no-files-found: warn
        retention-days: 30

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: |
          worker/
          *.md
        retention-days: 30
