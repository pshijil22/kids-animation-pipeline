name: Build Kids Animation Episode

on:
  push:
    branches:
      - main

concurrency:
  group: kids-animation-main
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install free local tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg curl blender espeak-ng libegl1 libgl1 libx11-6 libxi6 libxrender1
          python -m pip install --upgrade pip
          pip install -r worker/requirements.txt
          pip install piper-tts
          pip install flake8
      - name: Start Ollama model
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          nohup ollama serve > /tmp/ollama.log 2>&1 &
          for i in {1..180}; do
            curl -sf http://127.0.0.1:11434/api/tags >/dev/null && break
            sleep 1
          done
          curl --fail --retry 5 --retry-delay 5 -X POST http://127.0.0.1:11434/api/pull \
            -H 'Content-Type: application/json' \
            -d '{"name":"llama3.2:3b"}'
      - name: Validate pipeline
        run: |
          flake8 worker/*.py --count --select=E9,F63,F7,F82 --show-source --statistics
          cd worker
          python -m compileall -q .
          python -c "from pipeline import generate_story; print('Pipeline OK')"
      - name: Generate full animated movie
        env:
          OLLAMA_URL: http://localhost:11434
          OLLAMA_MODEL: llama3.2:3b
          DATA_DIR: ./data
          VIDEO_WIDTH: '1920'
          VIDEO_HEIGHT: '1080'
          VIDEO_FPS: '30'
          VIDEO_BITRATE: '1400k'
          VIDEO_MAXRATE: '1600k'
          VIDEO_BUFSIZE: '3200k'
          VIDEO_PRESET: veryfast
          CINEMATIC_PREVIEW: 'false'
          CINEMATIC_SCENE_SECONDS: '15.0'
          BLENDER_RENDER_FPS: '2'
          BLENDER_RENDER_WIDTH: '640'
          BLENDER_RENDER_HEIGHT: '360'
          BLENDER_SHARDS: '8'
          TTS_ENGINE: piper
          TTS_VOICE: en-us
          PIPER_MODEL: en_US-lessac-high
          TTS_RATE: '155'
          TTS_PITCH: '50'
          YOUTUBE_UPLOAD: 'false'
        run: |
          cd worker
          python -c "import asyncio; from pipeline import generate_story; asyncio.run(generate_story())"
      - name: Full movie quality check
        run: |
          file=$(find worker/data/videos -maxdepth 1 -name '*.mp4' -type f -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)
          test -n "$file"
          duration=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$file")
          width=$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 "$file")
          height=$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 "$file")
          audio=$(ffprobe -v error -select_streams a:0 -show_entries stream=codec_name -of csv=p=0 "$file")
          echo "Full movie: $file"
          echo "Duration: $duration"
          echo "Resolution: $width x $height"
          echo "Audio: $audio"
          python -c "d=float('$duration'); assert 1140 <= d <= 1260, 'Invalid movie duration: %ss' % d"
          test "$width" = "1920"
          test "$height" = "1080"
          test "$audio" = "aac"
          test "$(stat -c%s "$file")" -lt 450000000
      - name: Upload full movie artifact
        uses: actions/upload-artifact@v4
        with:
          name: kids-animated-episode
          path: worker/data/videos/*.mp4
          if-no-files-found: error
          retention-days: 30
