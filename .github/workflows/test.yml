name: Build Full Kids Animation Episode

on:
  push:
    branches:
      - '**'

concurrency:
  group: kids-animation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-render:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    services:
      ollama:
        image: ollama/ollama:latest
        ports:
          - 11434:11434

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y espeak-ng ffmpeg curl

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r worker/requirements.txt
          pip install flake8

      - name: Wait for Ollama
        run: |
          for i in {1..180}; do
            if curl -sf http://localhost:11434/api/tags >/dev/null; then
              echo 'Ollama ready'
              exit 0
            fi
            sleep 1
          done
          echo 'Ollama did not become ready'
          exit 1

      - name: Pull story model
        run: |
          curl --fail --retry 5 --retry-delay 5 -X POST http://localhost:11434/api/pull -d '{"name":"llama3.2:3b"}'

      - name: Validate code
        run: |
          flake8 worker/*.py --count --select=E9,F63,F7,F82 --show-source --statistics
          cd worker
          python -m compileall -q .
          python -c "from pipeline import generate_story; print('Pipeline import OK')"
          python -c "from blender_animation import create_animated_video; print('Renderer import OK')"

      - name: Generate complete 12-15 minute episode
        env:
          OLLAMA_URL: http://ollama:11434
          OLLAMA_MODEL: llama3.2:3b
          DATA_DIR: ./worker/data
          VIDEO_WIDTH: 1920
          VIDEO_HEIGHT: 1080
          VIDEO_FPS: 30
          VIDEO_CRF: 18
          VIDEO_PRESET: slow
        run: |
          cd worker
          python -c "import asyncio; from pipeline import generate_story; asyncio.run(generate_story())"

      - name: Verify final episode
        run: |
          file=$(find worker/data/videos -maxdepth 1 -name '*.mp4' -type f -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)
          test -n "$file"
          duration=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$file")
          width=$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 "$file")
          height=$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 "$file")
          echo "Episode: $file"
          echo "Duration: ${duration}s"
          echo "Resolution: ${width}x${height}"
          python -c "d=float('$duration'); assert 690 <= d <= 930, f'Invalid duration: {d}s'"
          test "$width" = "1920"
          test "$height" = "1080"

      - name: Upload finished episode
        uses: actions/upload-artifact@v4
        with:
          name: youtube-ready-episode
          path: worker/data/videos/*.mp4
          if-no-files-found: error
          retention-days: 30
