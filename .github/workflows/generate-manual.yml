name: Generate Video (Manual)

on:
  workflow_dispatch:
    inputs:
      count:
        description: 'Number of videos to generate'
        required: false
        default: '1'
      model:
        description: 'LLM model to use'
        required: false
        default: 'llama3.2:3b'

jobs:
  generate-manual:
    runs-on: ubuntu-latest
    
    services:
      ollama:
        image: ollama/ollama:latest
        ports:
          - 11434:11434
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y espeak-ng ffmpeg curl
    
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r worker/requirements.txt
    
    - name: Create data directories
      run: |
        mkdir -p data/stories
        mkdir -p data/audio
        mkdir -p data/scenes
        mkdir -p data/videos
    
    - name: Wait for Ollama to be ready
      run: |
        echo "Waiting for Ollama service..."
        for i in {1..180}; do
          if curl -s http://localhost:11434/api/tags > /dev/null 2>&1; then
            echo "✅ Ollama is ready"
            break
          fi
          echo "Attempt $i/180: Waiting for Ollama..."
          sleep 1
        done
    
    - name: Pull Ollama model
      run: |
        MODEL=${{ github.event.inputs.model || 'llama3.2:3b' }}
        echo "Pulling $MODEL model..."
        curl -X POST http://localhost:11434/api/pull -d "{\"name\":\"$MODEL\"}"
        sleep 30
    
    - name: Generate videos
      run: |
        cd worker
        export OLLAMA_URL=http://localhost:11434
        export OLLAMA_MODEL=${{ github.event.inputs.model || 'llama3.2:3b' }}
        COUNT=${{ github.event.inputs.count || '1' }}
        for i in $(seq 1 $COUNT); do
          echo "Generating video $i of $COUNT..."
          python generate_videos.py "$i" "$COUNT"
          echo "Waiting 30 seconds before next generation..."
          sleep 30
        done
    
    - name: Generate summary
      if: always()
      run: |
        echo "## 📹 Generation Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Videos Generated:** $(ls -1 data/videos/*.mp4 2>/dev/null | wc -l)" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Generated Files:" >> $GITHUB_STEP_SUMMARY
        ls -lh data/videos/ 2>/dev/null | tail -5 | awk '{print "- " $9 " (" $5 ")"}' >> $GITHUB_STEP_SUMMARY
    
    - name: Check generated files
      if: always()
      run: |
        echo "=== Listing data directory ==="
        find ./data -type f 2>/dev/null | head -20
        echo ""
        echo "=== Video files ==="
        ls -lh ./data/videos/ 2>/dev/null || echo "No videos directory"
    
    - name: Upload videos
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: videos-${{ github.run_id }}
        path: ${{ github.workspace }}/data/videos/
        retention-days: 30
    
    - name: Upload stories
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: stories-${{ github.run_id }}
        path: ${{ github.workspace }}/data/stories/
        retention-days: 30
    
    - name: Upload audio
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: audio-${{ github.run_id }}
        path: ${{ github.workspace }}/data/audio/
        retention-days: 30
    
    - name: Create release (optional)
      if: success()
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: video-${{ github.run_id }}
        release_name: Generated Videos Run ${{ github.run_id }}
        body: |
          Generated ${{ github.event.inputs.count || '1' }} videos
          Model: ${{ github.event.inputs.model || 'llama3.2:3b' }}
        draft: false
        prerelease: false
